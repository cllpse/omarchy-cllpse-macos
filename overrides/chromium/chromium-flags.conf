# Chromium flags for cllpse-macos. Fenced into ~/.config/chromium-flags.conf by
# overrides/apply.sh, on top of Omarchy's stock file -- which keeps its ozone,
# password-store, feature and extension lines untouched.
#
# The launcher (/usr/bin/chromium, a small C stub) reads this file and
# /etc/chromium-flags.conf, splits on whitespace with shell quoting, and skips
# lines starting with "#" -- so the fence markers are inert and comments are
# safe. Verified against its own --help output. Flags given on the command line
# still win over anything here.
#
# Pairs with chromium/default-zoom.py: this sets the device pixel ratio, that
# sets page zoom, and the two multiply. Changing one without the other moves
# page size.

# CORRECTION (2026-10-10, Chromium 152, measured): under Wayland this flag no
# longer pins the ratio. It only cancels the GTK text-scaling factor (1.0909 at
# text size 13); UI and pages follow the monitor scale, and pages that times
# zoom: 1.33333 x 1.1 = 1.4667 measured, so 1.25 x 1.1 = 1.375 at today's
# scale. Everything below is the original reasoning, true when it was tuned.
#
# Device pixel ratio, pinned to 1 against the monitor scale -- so this is
# deliberately an override, not a passthrough. Omarchy's stock file sets no
# scale flag at all; native would be the TV's 1.25 (1.33333 from 2026-10-08 to
# 2026-10-10, set back to 1.25 that day). The pairing below was
# tuned against DP-2's 1.25; when display.conf moved to 1.33333 (b177be7,
# 2026-10-08) the zoom was kept at 110% on purpose (decided 2026-10-09) rather
# than raised to the ~117% that would hold the old 0.88. The 1.25 figures are
# kept beside the current ones.
#
# What it buys: browser UI (tab strip, omnibox, menus) renders 25% smaller than
# the rest of the desktop (20% at 1.25), which is the wanted look. Page content
# would shrink with it, so default-zoom.py puts page zoom back on top.
#
# ~133% is the value that cancels this exactly (0.75 x 1.333 = 1.00, page
# layout 1:1 with native; 125% at 1.25). What ships is 110% [chosen] -- 0.75 x
# 1.1 = 0.825, so pages sit 17.5% under native (0.88 and 12% at 1.25), between
# full compactness and parity. Keep the pair in
# mind when changing either: page size is the product of the two, not of
# whichever one was edited last.
#
# What the cost is NOT: page text does not lose 0.75x worth of resolution. Zoom
# multiplies the device pixels a glyph gets, so the two compose -- at the
# cancelling zoom they cancel outright (measured at 1.25: the same paragraph
# fills a 719px-wide ink box under both this pairing at 125% and native
# 1.25/100%, at the same offset), and at the 110% shipped here page glyphs still
# get 0.825x, not 0.75x. The browser UI is the only part that really rasterises
# at 0.75x, since zoom does not touch it.
#
# Worth recording separately: Chromium ignores the stem darkening the rest of
# this repo leans on. FREETYPE_PROPERTIES has no effect on it (measured:
# identical output with darkening off, on and strong, while the same value
# through system FreeType adds 24% ink), and fontconfig's hinting -- already at
# hintnone -- is the only render param it honours. So if page text reads thin,
# no flag or fontconfig edit will fix it; the lever is CSS.
--force-device-scale-factor=1

# Overlay scrollbars: the thin, auto-hiding kind, which is what macOS does and
# what the rest of this desktop already looks like. Chromium draws a permanent
# 15px gutter scrollbar otherwise. Measured on 152 against a 5000px page in a
# throwaway profile: with the feature, the right edge is empty at rest; without
# it, a grey thumb sits there from load.
#
# This used to be a chrome://flags toggle, which is PROFILE state -- it lives
# in `browser.enabled_labs_experiments` in ~/.config/chromium/Local State, and
# when that key went missing the setting went with it, with nothing on the
# machine to explain why. A flag here is repo-owned and survives a profile
# reset; `chrome://version` shows no "You are using an unsupported command-line
# flag" banner for it either, since it arrives through the flags file.
#
# The Touchpad entry is Omarchy's, restated deliberately. A repeated
# --enable-features is NOT merged: base::CommandLine keys switches by name, so
# the LAST one wins outright and every feature named by an earlier copy is
# dropped. Measured both ways round -- with ours last the scrollbar overlays
# and Omarchy's line is gone; with Omarchy's last the scrollbar comes back.
# apply.sh checks the stock line against this one and says so if Omarchy ever
# adds a feature that is missing here.
--enable-features=TouchpadOverscrollHistoryNavigation,OverlayScrollbar

# The global-media-controls button -- the music-note icon that appears in the
# toolbar next to the profile avatar whenever any tab has an active media
# session, and opens a play/pause card.
#
# There is NO pref, policy or feature flag for it, checked rather than assumed:
# ToolbarView creates MediaToolbarButtonView unconditionally on Linux (the only
# gate is IsWebUIMediaButtonEnabled(), which picks the WebUI implementation
# instead of removing the button), the view's visibility is driven purely by
# Show()/Hide() from its controller, and its context menu offers only "show
# other sessions" and "report cast issue" -- no hide item. Nothing named
# GlobalMediaControls survives in the binary either; that feature graduated and
# its flag was removed.
#
# So the only lever left is the media session itself: with the service off
# there are no items for the controller to show and the button never appears.
# Measured on 152 in a throwaway profile playing a looping tone, screenshotted
# on an empty workspace -- music-note icon present without this flag, absent
# with it, everything else in the toolbar unchanged.
#
# THE COST, which is the whole reason this is a deliberate choice rather than a
# tidy-up: the same service is what exports MPRIS. The instance drops off the
# bus entirely (measured: two org.mpris.MediaPlayer2.chromium names with the
# service on, one -- the other browser -- with it off), so hardware/media keys
# and any now-playing widget reading MPRIS stop seeing Chromium. Page-level
# playback controls are untouched; only the browser-wide surface goes.
#
# --disable-features is keyed by switch name exactly like --enable-features
# above, so a second copy would win outright rather than merge. Omarchy's stock
# file carries no --disable-features line today; apply.sh checks both switches
# and says so if one appears.
--disable-features=MediaSessionService
