# /etc/systemd/system/keyd.service.d/restart.conf
# -- installed by overrides/keyd/keyd.sh
#
# keyd's packaged unit is four lines -- Type=simple, ExecStart, and no restart
# policy whatsoever:
#
#   [Service]
#   Type=simple
#   ExecStart=/usr/bin/keyd
#
# So a segfault is PERMANENT. Measured here, twice: keyd 2.6.0-5 dumped core on
# 2026-09-19 19:54:33 and again on 2026-09-22 17:27:27, both times within
# seconds of a `keyd reload` and with a byte-identical stack
# (keyd+0xbecf <- +0x13c56 <- +0x8495 <- +0x2c80). The second one went
# unnoticed for two days and twenty hours.
#
# Nothing about that was loud. keyd holds no window, prints nothing on the way
# down, and this repo's default.conf is identity-only -- [main] is empty and
# [ids] pins the Preonic alone -- so a dead keyd is simply a STOCK KEYBOARD.
# The only thing lost is the runtime `leftmeta = layer(figma)` bind, i.e.
# Cmd+click and Cmd+scroll in Figma and nothing else on the desktop. There is
# no symptom to notice until you next reach for a Figma gesture.
#
# RestartSec=1 rather than 0: the crash follows a config reparse, so an
# instantaneous respawn would re-enter the same path with no gap.
#
# The start limit is the half that keeps this honest. Restart=on-failure with
# no ceiling turns a config the daemon genuinely cannot survive into a silent
# respawn loop, which is a worse failure than the one being fixed -- it would
# look exactly like a working service. Five failures in sixty seconds and
# systemd gives up and leaves the unit in `failed`, where
# ~/.local/bin/cllpse-figma-keyd's own notification is the backstop: it fires
# the next time Figma takes focus, which is precisely when a missing remap
# starts costing anything.
#
# apply.sh clears that latch with `systemctl reset-failed keyd` before starting
# the daemon, so a machine that crash-looped yesterday is not refused today.
[Unit]
StartLimitIntervalSec=60
StartLimitBurst=5

[Service]
Restart=on-failure
RestartSec=1
