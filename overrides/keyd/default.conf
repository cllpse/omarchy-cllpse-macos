# /etc/keyd/default.conf -- installed by overrides/apply.sh
#
# This file deliberately remaps NOTHING. keyd runs, grabs the Preonic, and
# passes every key through unchanged; the only remap this repo ever applies is
# issued at RUNTIME by ~/.local/bin/cllpse-figma-keyd when Figma takes focus,
# and dropped again the moment it loses focus. Nothing here persists across a
# keyd restart or a reboot, which is the point: if anything goes wrong, killing
# keyd restores a stock keyboard.
#
# [ids] is pinned to the Drop Preonic and nothing else. The default `*` would
# have been wrong on this machine rather than merely broad: the Pulsar 8K
# dongle presents THREE interfaces the kernel reports as keyboards (Consumer
# Control, System Control, and a bare one), all under 3710:5406, so a wildcard
# would have pulled an 8000 Hz gaming mouse's dongle into keyd's event path for
# no reason. The vendor:product pin is what excludes it -- `k:` contributes
# nothing to that, see below.
#
#   03a8:a649  Drop Preonic   (I: Bus=0003 Vendor=03a8 Product=a649)
#
# The `k:` prefix is documented as matching keyboards exclusively (keyd(1):
# "the prefix k: may be used to exclusively match keyboards"), but measured
# here it excludes nothing -- ALL FIVE Preonic interfaces are grabbed, the
# mouse one included:
#
#   DEVICE: match 03a8:a649:8604edce  (Drop Preonic Keyboard)
#   DEVICE: match 03a8:a649:d80b2ca8  (Drop Preonic Consumer Control)
#   DEVICE: match 03a8:a649:cf3b9599  (Drop Preonic System Control)
#   DEVICE: match 03a8:a649:d9121f58  (Drop Preonic Mouse)      <-- not excluded
#   DEVICE: match 03a8:a649:4ee71d47  (Drop Preonic)
#
# (`journalctl -u keyd`, which prints one such line per device at startup and
# is the only place this is visible.)
#
# It is harmless, which is why the prefix is kept rather than dropped. That
# interface's key bitmap is `KEY=ff0000 0 0 0 0` in /proc/bus/input/devices --
# bits 272-279, i.e. exactly BTN_LEFT through BTN_TASK and not one typing key.
# There is no leftmeta on that stream for the runtime bind to land on, so
# grabbing it changes nothing; it costs an idle event path on a device that
# reports at human rates, not the dongle's 8000 Hz.
#
# Re-check with `keyd monitor` if the board is ever replaced.
[ids]
k:03a8:a649

# Empty on purpose -- see above. Every key keeps its own identity.
[main]

# ── The Figma layer ─────────────────────────────────────────────────────────
#
# DEFINED here, ACTIVATED nowhere. Nothing in [main] references it, so this
# section changes no key until ~/.local/bin/cllpse-figma-keyd issues
# `keyd bind 'leftmeta = layer(figma)'` at runtime, and `keyd bind reset`
# retires it again. A layer cannot be created by `keyd bind` -- only bound to
# -- which is the only reason any of this lives on disk.
#
# `:C` makes the layer behave as Control "in the absence of an explicit
# mapping" (keyd(1), Layers). That is what gives Figma a real ctrlKey on the
# two gestures Hyprland cannot translate at all -- Cmd+click for deep-select
# and Cmd+scroll for canvas zoom -- since hl.dsp has no pointer-button or
# scroll-axis dispatcher to synthesize them with.
#
# The explicit mappings below are the carve-outs, and they work because of the
# other half of that rule: "bindings are not affected by the modifiers of the
# layer in which they are defined". So `tab` emits a CLEAN Meta+Tab with no
# Control anywhere near it, and Hyprland's SUPER + TAB bind matches on the
# modmask it already expects. Stacking is preserved too -- keyd(1) gives
# shift+capslock+j -> shift+down -- so SHIFT + SUPER + TAB arrives as
# Shift+Meta+Tab and hits the switcher's "previous" bind for free.
#
# Only chords that are OS-level on macOS belong here. Cmd+Tab is the app
# switcher on macOS and is not a Figma shortcut, so routing it to the window
# switcher is the faithful behaviour rather than a compromise. Everything
# absent -- Cmd+C, Cmd+Z, Cmd+W and the rest -- stays Control and is handled by
# Figma itself, which is equally faithful: those are app-level on macOS too.
#
# Cmd+Q is the exception that proves the rule, and it took reading Figma's own
# menu table out of app.asar to see why:
#
#   "CommandOrControl+T":"NewTab"        "CommandOrControl+W":"CloseTab"
#   "CommandOrControl+Shift+W":"Close"   "Command+Q":"Quit"
#
# `Command+Q`, not `CommandOrControl+Q`. Electron's `Command` is macOS-only, so
# **Figma registers no Quit accelerator on Linux at all** and the Ctrl+Q this
# layer used to hand it landed on nothing whatsoever -- not a shortcut Figma
# chose to ignore, one it never had. Cmd+Q is also OS-level on macOS by any
# reading, so it belongs here on the same grounds as Cmd+Tab: it goes to
# Hyprland, whose SUPER+Q closes every window sharing the focused class
# (macos-shortcuts.lua), which is what quitting Figma means to this compositor.
#
# Cmd+W deliberately stays absent. `CommandOrControl+W` IS registered -- it
# calls closeActiveTab, through a menu that is genuinely installed
# (setApplicationMenu appears nine times) -- so the plain `:C` fallthrough
# already gives it the chord Hyprland's own SUPER+W would have synthesized.
# Carving it out would add a compositor round-trip to arrive at the same
# Ctrl+W.
[figma:C]

tab = M-tab
q = M-q
