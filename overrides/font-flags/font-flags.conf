# Font hinting for this Chromium-based app, fenced in by overrides/apply.sh
# (font-flags/). Above a device scale of 1 Chromium turns on subpixel
# positioning and, with it, sets hinting to none, so the SF autohint drop-in
# never reaches the text. This hands fontconfig's hinting back: UI text sits on
# whole pixels, and web content keeps subpixel x with slight, vertical-only
# hinting. One flag per line, no trailing comment: some of these launchers pass
# each line through as a single argument.
--disable-font-subpixel-positioning
