# The keybind whitelist. Every bind in effect that is NOT listed here gets an
# hl.unbind() generated for it on the next apply. Delete a line to prune that
# bind; the "#superseded by ..." lines below are exactly that, and their
# comments say which override took the chord over.
#
# THIS FILE SHIPS PRE-SEEDED, and that is the thing to know before running
# apply.sh on a second machine. apply.sh only seeds it from a live scan when it
# does not already exist -- and because it is tracked in git, it always exists
# in a fresh clone. So what you get is not "your machine's binds minus your
# edits", it is the AUTHOR'S machine's binds: anything yours has that this one
# did not (a newer Omarchy's defaults, a third-party plugin's binds, your own
# additions) is unlisted, and therefore unbound, silently.
#
# To start from your own machine instead, delete this file and re-apply; the
# next apply reseeds it from keybind-current.conf, which is the scan of what
# you actually have. Note that `git checkout` restores it, so if you want that
# to stick, keep the deletion out of the repo (or accept the reseed each time).
# Diff the two files to see what the difference amounts to on your hardware:
#
#   diff overrides/hypr/keybind-current.conf overrides/hypr/keybind-allowlist.conf
#
