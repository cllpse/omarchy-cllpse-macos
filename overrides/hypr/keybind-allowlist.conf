#DONE (see overrides/hypr/macos-shortcuts.lua):
# Real macOS uses Option for word-level and Cmd for line/document-level, not
# Alt for both -- implemented as true parity rather than literally as first
# written:
# - ALT + LEFT/RIGHT           word jump              (Option+Left/Right)
# - ALT + SHIFT + LEFT/RIGHT   select word             (Option+Shift+Left/Right)
# - SUPER + LEFT/RIGHT         line start/end          (Cmd+Left/Right)
# - SUPER + SHIFT + LEFT/RIGHT select to line start/end (Cmd+Shift+Left/Right)
#   ^ repurposed from window-focus-left/right and swap-window-left/right,
#     which had no other free slot once Super took over the Cmd role here.
# - SUPER + W        close a tab/document (Cmd+W) via a real Ctrl+W, not
#                    hl.dsp.window.close() -- that only closes the whole WM
#                    window, never "a tab in Chrome". In a terminal it sends
#                    Ctrl+SHIFT+W instead: Ctrl+W there is the readline word-
#                    erase, while Ctrl+Shift+W is Ghostty's close_tab:this
#                    (and kitty's close_window), which falls through to
#                    closing the window on the last tab -- exactly Cmd+W.
#                    This used to do nothing at all in a terminal.
# - SUPER + Q        quit the APP, not the window (Cmd+Q) -- closes every
#                    window sharing the focused window's class, on every
#                    workspace, via hl.get_windows(). NOT a synthesized
#                    Ctrl+Q (most Linux apps don't bind it at all --
#                    confirmed doing nothing in Cursor and Chrome).
#                    window.kill() was tried and rejected: confirmed live it
#                    hard-kills with zero chance for the app to prompt "save
#                    changes?" -- unacceptable for a terminal-heavy
#                    workflow. Each window gets its own graceful
#                    hl.dsp.window.close(), the same request as clicking the
#                    close button, so a per-window "save first?" dialog still
#                    appears. Grouping is by class, not pid: that is what
#                    macOS means by "the app", so two separately launched
#                    instances quit together.
# - SUPER + Z / SUPER + SHIFT + Z   undo / redo (Ctrl+Z / Ctrl+Shift+Z)
# - SUPER + S        save (Ctrl+S)
#
# Undo/redo/save are skipped (no-op) when a terminal is focused -- Ctrl+Z
# there is SIGTSTP (suspends the foreground job) and Ctrl+S is XOFF (freezes
# terminal output). Forwarding either into a shell would be actively harmful,
# not just wrong. Close (Cmd+W) was in that group for the same reason -- plain
# Ctrl+W deletes the word being typed -- but it is no longer skipped: it sends
# the terminal's own close-tab chord instead, see above. Quit (Cmd+Q) never
# needed the guard; it is a compositor-level close request, not a synthesized
# control character. Word
# jump / line start-end are NOT guarded -- Ctrl+Left/Right and Home/End are
# already the native readline bindings in a terminal, same as real macOS
# Terminal.app.
#
#STILL OPEN -- more macOS parity to consider, not yet implemented:
# - Cmd+A select all, Cmd+F find -- both already match the Linux-native
#   Ctrl+A/Ctrl+F in most apps, so likely need no override at all; worth
#   confirming per-app rather than assuming.
# - Cmd+N new window, Cmd+T new tab -- same caveat as Cmd+W: the WM has no
#   concept of "a tab", so these would need the same universal-shortcut
#   treatment (synthesize Ctrl+N / Ctrl+T) as W/Q/Z/S above.
# - Cmd+P -- real conflict, not just a gap: Cmd+P prints in a browser but
#   Ctrl+P opens Quick Open in Cursor/VSCode. A blind Ctrl+P forward gives
#   the right *muscle memory* but not the same *action* in every app.
# - Cmd+Up/Down (document start/end) and Option+Up/Down (paragraph jump) --
#   the natural extension of the Left/Right work above, but SUPER+UP/DOWN is
#   still live as window-focus-up/down and wasn't asked for, so left alone.
# - Cmd+, preferences, Cmd+M minimize -- niche enough to skip until asked.
