# Brave Origin flags for cllpse-macos. Fenced into ~/.config/brave-origin-flags.conf
# by overrides/apply.sh, on top of whatever is already there -- the Omarchy-style
# ozone / password-store / feature / extension lines are left untouched.
#
# Brave Origin (brave-origin-bin, AUR) is a Chromium fork with the same
# flags-file launcher convention as system Chromium, only the launcher is a bash
# script rather than a C stub: /usr/bin/brave-origin reads this file ONE FLAG PER
# LINE (no whitespace split), skips lines matching /^[[:space:]]*(#|$)/ -- so the
# fence markers and every comment here are inert -- and execs
# /opt/brave-origin-bin/brave. Flags on the command line still win.
#
# Pairs with chromium/default-zoom.py exactly as the Chromium file does: this
# pins the device pixel ratio, that puts page zoom back on top, and page size is
# the product of the two.
#
# The full rationale for the value lives in overrides/chromium/chromium-flags.conf
# and applies verbatim -- Brave shares Chromium's renderer and this machine's
# DP-2 1.25 monitor scale. In short: 0.8 x 1.25 = 1.00 would be exactly 1:1 with
# native, 110% ships (0.8 x 1.1 = 0.88), and the browser UI is the only part that
# really rasterises at 0.8x since zoom does not touch it.
--force-device-scale-factor=1
