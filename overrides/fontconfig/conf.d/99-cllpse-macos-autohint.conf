<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  99-cllpse-macos-autohint.conf
  Installed to ~/.config/fontconfig/conf.d/ by overrides/apply.sh.

  FreeType's autohinter for the three SF families. Apple ships SF Pro and SF
  Mono with no hints at all (checked 2026-10-20 against Apple's own DMGs: 0 of
  35,683 glyphs hinted in SF Pro Text, 0 of 1,628 in SF Mono, and the variable
  TTFs carry no instructions), and the Nerd Font patcher adds none. For a CFF
  font, slight hinting runs the font's own hints, so on SF it did nothing:
  hintslight and hintnone rendered identically. This puts the autohinter in
  their place, still at the system's slight. Horizontal edges (baseline,
  x-height, cap height, crossbars) land on whole pixel rows; vertical stems and
  spacing are left alone. At 18.67 px the top row of an H went from 35/255
  coverage to 255 (system FreeType, measured).

  Reaches what renders through fontconfig with hinting on: GTK 3 and 4 (cairo),
  Qt native text (the Omarchy shell and both plugins, with
  QML_DISABLE_DISTANCEFIELD from hypr/hyprland-env.lua), and Chromium, Chrome
  and the Electron apps through --disable-font-subpixel-positioning (chromium/,
  font-flags/, figma/), since above a device scale of 1 they turn hinting off
  themselves. Comic Code carries its own hints and is not listed.

  Chosen 2026-10-23 by eye from a Qt Quick render of the switcher's and
  supermenu's text, over unhinted and over Adobe's otfautohint baked into a
  rebuilt font. Remove this file and run `fc-cache -f` to go back to unhinted SF.
-->
<fontconfig>

  <match target="font">
    <test name="family" qual="any"><string>SFProText Nerd Font Propo</string></test>
    <edit name="autohint" mode="assign"><bool>true</bool></edit>
  </match>
  <match target="font">
    <test name="family" qual="any"><string>SFProDisplay Nerd Font Propo</string></test>
    <edit name="autohint" mode="assign"><bool>true</bool></edit>
  </match>
  <match target="font">
    <test name="family" qual="any"><string>SFMono Nerd Font Mono</string></test>
    <edit name="autohint" mode="assign"><bool>true</bool></edit>
  </match>

</fontconfig>
