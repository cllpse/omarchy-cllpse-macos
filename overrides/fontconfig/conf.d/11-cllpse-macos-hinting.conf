<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  11-cllpse-macos-hinting.conf
  Installed to ~/.config/fontconfig/conf.d/ by overrides/apply.sh.

  Overrides the stock /etc/fonts/conf.d/10-hinting-slight.conf. Files in
  ~/.config/fontconfig/conf.d/ are pulled in at the "50-user" point, i.e. after
  the system 10-x rendering defaults, so an unconditional "assign" here wins.

  Rationale: under Wayland fractional scaling (Hyprland scale not 1) every
  toolkit falls back to grayscale, non-subpixel AA. hintslight then snaps the
  SF Pro / SF Mono stems hard to the pixel grid, which reads as sharp/spiky.
  The SF faces are drawn to render unhinted, so hintnone leans on the AA and
  softens the edges.

  This is only the fontconfig side (Qt / Alacritty / Electron). apply.sh also
  sets `gsettings org.gnome.desktop.interface font-hinting 'none'` for GTK/GNOME
  and appends `freetype-load-flags = no-hinting` to ~/.config/ghostty/config
  (see overrides/ghostty/hinting.conf). Kitty hardcodes light hinting, no knob.

  Middle ground if hintnone reads as too soft at small sizes: switch these to
  hintslight and add an autohint=true assign (consistent light autohinting
  instead of SF's sparse native hints).

  Remove this file, then run `fc-cache -r`, to go back to the system hintslight.
  (Keep this comment free of the XML-forbidden double-hyphen sequence.)
-->
<fontconfig>
  <match target="pattern">
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintnone</const></edit>
  </match>
  <match target="font">
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintnone</const></edit>
  </match>
</fontconfig>
