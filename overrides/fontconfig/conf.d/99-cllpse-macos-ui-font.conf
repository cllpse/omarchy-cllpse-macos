<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  99-cllpse-macos-ui-font.conf
  Installed to ~/.config/fontconfig/conf.d/ by overrides/apply.sh.

  cllpse-macos theme companion — proportional UI font = SF Pro.
    SF Pro Text below 20pt, SF Pro Display at 20pt and up (macOS optical size).

  Additive drop-in. Does NOT touch monospace (that's `omarchy font set`, which
  writes a separate file, ~/.config/fontconfig/fonts.conf).
  Loaded via 50-user.conf, i.e. AFTER /etc/fonts/conf.d/50-omarchy.conf, which
  assigns sans-serif / system-ui / -apple-system -> Liberation Sans. By then the
  generic token is gone, so we also remap the resolved family "Liberation Sans".

  Requires the SF Pro faces installed (e.g. ~/.local/share/fonts/SF/).
  Remove this file to go back to Omarchy's Liberation Sans UI.
-->
<fontconfig>

  <!-- sans-serif, on the chance it reaches here unclaimed -->
  <match target="pattern">
    <test name="family" qual="any"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>SFProText Nerd Font Propo</string>
    </edit>
  </match>

  <!-- 50-omarchy.conf has already resolved the sans generics to Liberation
       Sans; put SF Pro Text in front of it. Liberation Sans is only ever a
       substitute here, so matching it verbatim is intentional. -->
  <match target="pattern">
    <test name="family" qual="any"><string>Liberation Sans</string></test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>SFProText Nerd Font Propo</string>
    </edit>
  </match>

  <!-- Apple system-font aliases named by web pages and Electron apps -->
  <alias>
    <family>system-ui</family>
    <prefer><family>SFProText Nerd Font Propo</family></prefer>
  </alias>
  <alias>
    <family>-apple-system</family>
    <prefer><family>SFProText Nerd Font Propo</family></prefer>
  </alias>
  <alias>
    <family>BlinkMacSystemFont</family>
    <prefer><family>SFProText Nerd Font Propo</family></prefer>
  </alias>

  <!-- Optical-size crossover: Text < 20pt, Display >= 20pt. Works on both
       size and pixelsize. Must follow the family assigns above. -->
  <match target="pattern">
    <test name="family" qual="any"><string>SFProText Nerd Font Propo</string></test>
    <test name="size" compare="more_eq"><double>20</double></test>
    <edit name="family" mode="assign" binding="strong">
      <string>SFProDisplay Nerd Font Propo</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>SFProText Nerd Font Propo</string></test>
    <test name="pixelsize" compare="more_eq"><double>20</double></test>
    <edit name="family" mode="assign" binding="strong">
      <string>SFProDisplay Nerd Font Propo</string>
    </edit>
  </match>

  <!-- SF Pro ships no italic files; synthesise oblique so <em> isn't upright.
       SF Mono has real italics and is deliberately not referenced here. -->
  <match target="font">
    <test name="family" qual="any"><string>SFProText Nerd Font Propo</string></test>
    <test name="slant"><const>roman</const></test>
    <test target="pattern" name="slant" compare="not_eq"><const>roman</const></test>
    <edit name="matrix" mode="assign">
      <times>
        <name>matrix</name>
        <matrix><double>1</double><double>0.2</double>
                <double>0</double><double>1</double></matrix>
      </times>
    </edit>
    <edit name="slant" mode="assign"><const>italic</const></edit>
  </match>
  <match target="font">
    <test name="family" qual="any"><string>SFProDisplay Nerd Font Propo</string></test>
    <test name="slant"><const>roman</const></test>
    <test target="pattern" name="slant" compare="not_eq"><const>roman</const></test>
    <edit name="matrix" mode="assign">
      <times>
        <name>matrix</name>
        <matrix><double>1</double><double>0.2</double>
                <double>0</double><double>1</double></matrix>
      </times>
    </edit>
    <edit name="slant" mode="assign"><const>italic</const></edit>
  </match>

</fontconfig>
