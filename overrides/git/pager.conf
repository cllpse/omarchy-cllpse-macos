# Route `git diff` through hunk, a hunk-navigating pager. hunk is mise-managed
# (`mise use -g hunk`), so it lives on the shims path rather than in /usr/bin --
# checked, `~/.local/share/mise/shims` is in the uwsm session environment
# (Omarchy's default/bash/env-bootstrap:34 puts it there), so a git invoked from
# a GUI app finds it too, not just an interactive shell.
#
# No guard needed: git runs pager.diff through a shell and, when the binary is
# missing, writes the diff straight to stdout and exits 0 with nothing on stderr
# (measured against a bogus pager name). So this line is inert rather than
# broken on a machine without hunk.
#
# Keep this block LAST in the file. It opens a [pager] section, so any key added
# after it without a section header of its own would silently land in [pager].
[pager]
	diff = hunk pager
