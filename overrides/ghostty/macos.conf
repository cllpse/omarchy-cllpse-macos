# Ghostty settings for cllpse-macos. Fenced into ~/.config/ghostty/config by
# overrides/apply.sh. Colours and the theme file come from Omarchy's own
# generated ghostty.conf (config-file line at the top of that file) -- nothing
# here touches them.
#
# Restart Ghostty windows to pick these up; it has no full config reload.

# SF faces render unhinted -- grid-snapped stems read as sharp under grayscale
# AA (Wayland fractional scaling). The fontconfig and GTK sides of this are the
# step-2 drop-in and the gsettings call in apply.sh.
freetype-load-flags = no-hinting

# --- macOS window chrome -----------------------------------------------------
# Hyprland draws the border and rounding, so Ghostty draws none of its own.
window-decoration = none
window-show-tab-bar = never
window-padding-x = 14
window-padding-y = 9
window-padding-balance = true
window-inherit-working-directory = true
window-vsync = true
cursor-style = block
shell-integration-features = no-cursor
scroll-to-bottom = keystroke, output
copy-on-select = false
clipboard-read = allow
resize-overlay = never
bell-features = no-title
progress-style = false
unfocused-split-opacity = 0.333

# --- macOS keyboard muscle memory --------------------------------------------
# SUPER stands in for Cmd. Omarchy binds SUPER for window management, so these
# only apply while Ghostty has focus.
keybind = control+arrow_down=goto_split:down
keybind = control+arrow_left=goto_split:left
keybind = control+arrow_right=goto_split:right
keybind = control+arrow_up=goto_split:up
keybind = copy=copy_to_clipboard
keybind = paste=paste_from_clipboard
keybind = shift+arrow_down=adjust_selection:down
keybind = shift+arrow_left=adjust_selection:left
keybind = shift+arrow_right=adjust_selection:right
keybind = shift+arrow_up=adjust_selection:up
keybind = super+arrow_left=text:\\x01
keybind = super+a=select_all
keybind = super+c=copy_to_clipboard
keybind = super+k=text:clear\n
keybind = super+q=quit
keybind = super+shift+p=toggle_command_palette
keybind = super+shift+w=close_window
keybind = super+shift+z=redo
keybind = super+t=new_split:auto
keybind = super+v=paste_from_clipboard
keybind = super+z=undo
