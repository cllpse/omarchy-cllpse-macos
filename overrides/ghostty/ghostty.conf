# Ghostty settings for cllpse-macos. Fenced into ~/.config/ghostty/config by
# overrides/apply.sh, on top of Omarchy's own stock config -- which keeps its
# keybindings, padding, window chrome and theme include untouched. Colours come
# from the generated ghostty.conf that stock config-file line pulls in.
#
# Deliberately NOT here: macOS keybinding emulation (super+c/v/t/q/z/a and
# friends) and window-chrome overrides (window-decoration = none,
# window-show-tab-bar = never). They fought Omarchy's own bindings and chrome for
# no benefit -- SUPER is Omarchy's window-management modifier -- and the whole
# `macos-*` family is a no-op on Linux regardless.
#
# Restart Ghostty windows to pick these up; it has no full config reload.

# --- font rendering: the half of the SF work that lives in the terminal -------
# SF faces render unhinted -- grid-snapped stems read as sharp under grayscale
# AA (Wayland fractional scaling). The fontconfig and GTK sides of this are the
# step-2 drop-in and the gsettings call in apply.sh; the FreeType stem-darkening
# side is overrides/environment.d/10-cllpse-macos-font-rendering.conf.
#
# font-family and font-size are NOT set here: `omarchy font set` and
# `omarchy display text size` sed them directly into the stock config, and a
# value here would silently disagree with whatever those wrote.
freetype-load-flags = no-hinting

# --- preferences that differ from Ghostty's defaults -------------------------
# None of these are macOS emulation; they are workflow choices Omarchy does not
# express an opinion on. Each is listed with the default it overrides, so it is
# obvious what removing the line would restore.
# Ghostty has no inline comments -- a `#` only starts one at the start of a
# line, so a trailing "# default: ..." is parsed as part of the value and the
# whole line is rejected. Each default goes on its own line above its key.

# default: keystroke,no-output
scroll-to-bottom = keystroke,output
# default: true
copy-on-select = false
# default: ask
clipboard-read = allow
# default: no-system,no-audio,attention,title,no-border
bell-features = no-title
# default: true
progress-style = false
# default: current
window-new-tab-position = end

# In-window toasts (GTK only) -- the "Copied to clipboard" and "Config
# reloaded" overlays that float on top of the terminal. `false` is the
# all-off switch; the key also takes a per-notification list
# (`no-clipboard-copy,no-config-reload`) if one of them is ever wanted back.
# Nothing is lost with config-reload gone: Ghostty has no full config reload
# to announce in the first place (see the note at the top of this file).
# default: clipboard-copy,config-reload
app-notifications = false

# A program that requests mouse reporting (Claude Code among them) otherwise
# captures shift-click-drag too, leaving no native selection for SUPER+C's
# control+insert to copy. `never` forces shift-drag to always select, and the
# program can't override it back via XTSHIFTESCAPE the way plain `true` allows.
# default: false
mouse-shift-capture = never

# --- unfocused cursor -------------------------------------------------------
# Ghostty draws the cursor as a hollow outline on any unfocused surface and has
# no key to change that (`cursor-invert-fg-bg` was removed; a custom-shader
# post-process does not composite over the unfocused frame). This key thickens
# the outline -- and only the outline and the bar cursor, never the focused
# solid block -- far enough that the unfocused cursor fills in and reads as a
# block. Bump it if a wider cell still shows a gap; `-N%` / `+Npx` also work.
# default: 0
adjust-cursor-thickness = 200%

# --- restoring a Ghostty default Omarchy turns off ---------------------------
# Omarchy's stock config (/usr/share/omarchy/config/ghostty/config:13) ships
# `confirm-close-surface=false`, so a Ghostty window with a job still running
# closes silently -- from SUPER+Q, Alt+F4, the close button, anything. That is
# Omarchy's line, not ours, and it predates the SUPER+Q remap; the remap uses
# `hl.dsp.window.close()`, the same graceful dispatcher Omarchy binds SUPER+W
# to in tiling.lua:1, so the WM side sends exactly the polite close request an
# app needs in order to prompt. Ghostty just wasn't listening.
#
# This block is spliced in below line 13 and Ghostty resolves a repeated key
# last-wins (verified against a throwaway XDG_CONFIG_HOME: `false` then `true`
# resolves to true), so re-stating the key here wins without editing Omarchy's
# stock section.
#
# `true` is Ghostty's own default and asks only when shell integration reports
# a non-shell process running -- which means it can miss one started inside
# tmux or over ssh, where integration doesn't see it. `always` prompts
# unconditionally, idle shells included; too noisy to be worth the coverage.
# omarchy default: false (ghostty default: true)
confirm-close-surface = true

# Cmd+K clears the terminal, as it does in macOS Terminal and iTerm2.
# clear_screen wipes the screen AND the scrollback -- the same result as running
# `clear`, whose xterm-ghostty entry emits ESC[H ESC[2J ESC[3J (that last one is
# the E3 capability, which is what takes the scrollback with it). Done as a
# terminal action rather than injected text it also works while a command is
# running, and keeps `clear` out of shell history.
#
# This reaches Ghostty only because SUPER+K is not bound in Hyprland. It was
# Omarchy's "Keybindings" menu; it is commented out in
# ../hypr/keybind-allowlist.conf, so the generated keybind-unbinds.lua unbinds
# it and the key falls through to the focused window. Uncommenting that
# allowlist line would silently take this binding back -- a Hyprland bind beats
# the surface, same as the mouse binds in window-switcher-bindings.lua.
#
# Ghostty-only. Alacritty/foot/kitty would each need their own equivalent.
keybind = super+k=clear_screen
