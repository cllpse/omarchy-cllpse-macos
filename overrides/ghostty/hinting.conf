# Ghostty ignores fontconfig hinting and enables hinting by default. Turn it
# off so SF Mono matches the system-wide hintnone set by apply.sh (fontconfig
# 11-cllpse-macos-hinting.conf + gsettings font-hinting=none) -- under grayscale
# AA (Wayland fractional scaling) grid-snapped stems read as sharp/spiky.
# Appended to ~/.config/ghostty/config by overrides/apply.sh; reload Ghostty
# (Ctrl+Shift+,) or restart it to pick this up.
freetype-load-flags = no-hinting
