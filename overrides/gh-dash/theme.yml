# gh-dash's theme block, merged into ~/.config/gh-dash/config.yml by apply.sh --
# merged rather than copied because that file also holds the user's own
# prSections / issuesSections / layout, which this repo has no business owning.
#
# Values are ANSI palette INDICES as strings, which is how lipgloss (via
# termenv) distinguishes them from hex: a "#"-prefixed string is a literal RGB
# colour, a bare number is an index into the terminal's own palette. 0-7 are the
# base slots, 8-15 the bright ones -- all of them repainted by Omarchy from the
# active theme's colors.toml, so this tracks a theme switch with no
# regeneration.
#
# Unverified end-to-end, unlike the other four: gh-dash blocks on an OSC 11
# background query and never renders in a bare pty, so the emitted SGR codes
# could not be observed here. The index-vs-hex behaviour above is lipgloss's
# documented contract and the keys are read from this build's own yaml tags, but
# confirm it by eye on the first `gh dash` after applying.
theme:
  colors:
    text:
      primary: "7"     # normal row text
      secondary: "4"   # accent -- section titles, counts
      inverted: "0"    # text drawn on an accent fill
      faint: "8"       # timestamps, secondary metadata
      warning: "3"
      success: "2"
      error: "1"
    background:
      selected: "8"
    border:
      primary: "4"
      secondary: "8"
      faint: "0"
