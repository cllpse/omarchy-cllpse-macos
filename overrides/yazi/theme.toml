# yazi, pinned to the terminal's 16-colour ANSI palette -- which Omarchy
# repaints from the active theme's colors.toml on every `omarchy theme set`, so
# this follows a theme switch with nothing to regenerate. Same approach as
# ../lazygit/config.yml, ../lazydocker/config.yml and ../bat/config.
#
# This is NOT undoing a hardcoded palette. yazi's own preset theme is already
# ANSI-based -- checked against the preset embedded in this build (26.9.1):
# `border_style = { fg = "gray" }`, `normal_main = { bg = "blue" }`, and every
# [filetype] rule picks a colour NAME rather than a hex. What this file does is
# pin the accent to `blue` so yazi agrees with the other TUIs instead of
# spreading accents across several hues, and flatten the chrome onto
# `reset` (the terminal's own default) and `darkgray`.
#
# The file ICONS are handled too, by the generated block at the end of this
# file. They are the one part of yazi that ships fixed hex: ~725 rules, each
# carrying its own glyph alongside its colour. There is no switch to strip the
# colour and keep the glyph, and overriding only some rules blanks the glyphs of
# the rest, so the whole table is restated with the fg values bucketed by hue
# onto ANSI names. See generate-icons.py -- re-run it after a yazi upgrade.
#
# Note the [icon] arrays are `dirs` / `files` / `exts` / `globs` / `conds` (plus
# prepend_/append_ variants), NOT the `rules` key [filetype] uses; a
# `prepend_rules` here is silently ignored like any unknown key, which is an
# easy hour to lose.
#
# Deliberately omitted: the symbol keys (border_symbol, marker_symbol,
# status.sep_left/sep_right, notify.icon_*, confirm.btn_labels) are glyphs or
# arrays, not colours.
#
# `mgr.syntect_theme` is set, and it is the one key here that is a TRADE rather
# than a straight win. It names a .tmTheme for the previewer's syntax
# highlighting, and a .tmTheme holds literal hex only.
#
# Left unset, yazi highlights in ANSI and tracks the terminal live -- measured:
# keywords `35m`, function names `34m`, parameters `36m`, strings `32m`, zero
# truecolor on the whole screen. Set, it emits truecolor from the file instead
# (checked with a probe theme: its `#FF00FF` came back as `38;2;255;0;255`).
#
# The file it points at is generated per theme by
# hooks/theme-set.d/yazi-syntax.sh, so it still follows `omarchy theme set` --
# just at theme-set time rather than at render time. What that buys is the full
# macOS palette instead of ANSI's 16 slots, and Xcode's project-vs-system
# symbol split. Delete this key to go back to the ANSI behaviour; nothing else
# in this file depends on it.
#
# `~` IS expanded here despite yazi's "must be either empty or an absolute
# path" message (checked: a ~-path theme's colours reached the output), so the
# path does not need substituting at install time.

[mgr]
syntect_theme = "~/.config/yazi/cllpse-macos.tmTheme"

cwd = { fg = "blue" }

hovered         = { reversed = true }
preview_hovered = { underline = true }

find_keyword  = { fg = "yellow", bold = true }
find_position = { fg = "magenta", bold = true }

marker_copied   = { fg = "green",  bg = "green" }
marker_cut      = { fg = "red",    bg = "red" }
marker_marked   = { fg = "cyan",   bg = "cyan" }
marker_selected = { fg = "yellow", bg = "yellow" }

count_copied   = { fg = "reset", bg = "green" }
count_cut      = { fg = "reset", bg = "red" }
count_selected = { fg = "reset", bg = "yellow" }

border_style = { fg = "darkgray" }

[mode]
normal_main = { fg = "reset",   bg = "blue",    bold = true }
normal_alt  = { fg = "blue",    bg = "reset" }
select_main = { fg = "reset",   bg = "green",   bold = true }
select_alt  = { fg = "green",   bg = "reset" }
unset_main  = { fg = "reset",   bg = "magenta", bold = true }
unset_alt   = { fg = "magenta", bg = "reset" }

[status]
overall         = { fg = "reset", bg = "reset" }
perm_type       = { fg = "blue" }
perm_read       = { fg = "yellow" }
perm_write      = { fg = "red" }
perm_exec       = { fg = "green" }
progress_label  = { fg = "reset", bold = true }
progress_normal = { fg = "blue",  bg = "reset" }
progress_error  = { fg = "red",   bg = "reset" }

[tabs]
active   = { fg = "reset", bg = "blue", bold = true }
inactive = { fg = "blue",  bg = "reset" }

[which]
cand            = { fg = "green" }
rest            = { fg = "darkgray" }
desc            = { fg = "reset" }
separator_style = { fg = "darkgray" }

[confirm]
border  = { fg = "blue" }
title   = { fg = "blue" }
content = {}
list    = { fg = "blue" }
btn_yes = { reversed = true }
btn_no  = {}

[spot]
border  = { fg = "blue" }
title   = { fg = "blue" }
tbl_col = { fg = "blue" }

[notify]
title_info  = { fg = "green" }
title_warn  = { fg = "yellow" }
title_error = { fg = "red" }

[pick]
border   = { fg = "blue" }
active   = { fg = "magenta", bold = true }
inactive = {}

[input]
border   = { fg = "blue" }
title    = {}
value    = {}
selected = { reversed = true }

[cmp]
border   = { fg = "blue" }
active   = { reversed = true }
inactive = {}

[tasks]
border  = { fg = "blue" }
title   = {}
hovered = { fg = "magenta", underline = true }

[help]
on      = { fg = "cyan" }
run     = { fg = "magenta" }
hovered = { reversed = true, bold = true }
footer  = { fg = "reset", bg = "reset" }

