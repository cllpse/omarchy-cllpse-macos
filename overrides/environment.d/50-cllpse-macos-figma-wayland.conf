# Figma Desktop as a native Wayland client.
#
# The app is nickvdp/figma-desktop-linux -- an AppImage repack of Figma's own
# Electron build, not the community figma-linux wrapper around the web app.
#
# Its bundled launcher defaults to X11 and passes --ozone-platform=x11
# explicitly (usr/lib/figma-desktop/launcher-common.sh: use_x11_on_wayland=true),
# which overrides Omarchy's global ELECTRON_OZONE_PLATFORM_HINT=wayland.
# FIGMA_USE_WAYLAND=1 is that launcher's own documented opt-out.
#
# Why it matters here: under XWayland with decoration:xwayland force_zero_scaling
# = true, Figma renders unscaled and lands at 1/monitor-scale of the intended
# size -- 80% on a 1.25 scale. Native Wayland gets Hyprland's normal scaling.
#
# This is the only mechanism setting it. A wrapper around the app's AppRun did
# the same job here for a while and was removed by apply.sh step 7e -- it had to
# displace the real launcher to AppRun.real, which broke the path that launcher
# derives its desktop entry from, and then needed an APPIMAGE export to repair
# what it had broken. This drop-in has none of that coupling.
#
# Why environment.d rather than a wrapper around the AppImage's AppRun: an
# AppImage update re-extracts the app directory and silently drops any wrapper
# placed inside it, reverting the behaviour with no visible cause. Nothing an
# update does reaches this file. Read by systemd's user session, which is how
# uwsm starts Hyprland here, so it applies from the next login.
FIGMA_USE_WAYLAND=1
