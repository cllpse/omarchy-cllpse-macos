# FreeType stem darkening, off — the macOS-side of the font rendering work.
#
# Stem darkening artificially thickens glyph stems to imitate gamma-correct
# blending. Arch's freetype2 ships it enabled for the CFF and autofit drivers,
# which makes SF Pro and SF Mono read heavier than they do on macOS. Turning it
# off is what keeps the SF faces at their designed weight; the explicit
# darkening-parameters are carried over so anything that re-enables darkening
# still uses a sane curve rather than the driver default.
#
# Pairs with the hintnone settings in apply.sh (fontconfig drop-in, GTK
# gsettings, and Ghostty's freetype-load-flags): unhinted outlines at their true
# weight is the combination that matches macOS.
#
# Read by the systemd user session, so this applies from the next login and
# reaches every application, not just the ones with their own font config.
FREETYPE_PROPERTIES=cff:no-stem-darkening=0 autofitter:no-stem-darkening=0 cff:darkening-parameters=500,450,1000,350,1500,250,2000,100 autofitter:darkening-parameters=500,450,1000,350,1500,250,2000,100
