# FreeType stem darkening, turned ON and strengthened — the rasteriser half of
# the SF font work. Read by the systemd user session, so it applies from the
# next login and reaches every application, not just ones with their own font
# config.
#
# Context: on a ~110 PPI display with Hyprland at a fractional scale, subpixel
# AA is off and everything is rendered grayscale. SF Mono and SF Pro are CFF
# .otf faces drawn thin for macOS's heavier rasteriser, so under grayscale AA at
# this density they come out sharp and spiky rather than the weight they look on
# a Mac. Darkening puts that weight back.
#
# - `no-stem-darkening=0` sets "no darkening" to FALSE, i.e. it ENABLES stem
#   darkening — for the CFF driver (the SF faces) and for the autohinter (fonts
#   with no native hints). Note the double negative; setting this to 1 disables
#   darkening. Arch's FreeType already darkens CFF by default, so most of the
#   visible change here comes from the stronger curve below plus the autofitter
#   being switched on.
# - `darkening-parameters` is four (pointsize, boost) pairs, boost in 1/1000 em.
#   The stock curve is 500,400 1000,275 1500,175 2000,0; the values below darken
#   more, especially at the small sizes used in a terminal. Dial toward stock if
#   text reads too heavy, or drop the line entirely to keep the default curve.
#
# Pairs with the hintnone settings in apply.sh (fontconfig drop-in, GTK
# gsettings, Ghostty freetype-load-flags): unhinted outlines, darkened back to
# their intended weight, is the combination that reads like macOS here.
#
# systemd environment.d takes the value literally — no surrounding quotes, and
# darkening-parameters must be comma-separated, since spaces separate properties.
FREETYPE_PROPERTIES=cff:no-stem-darkening=0 autofitter:no-stem-darkening=0 cff:darkening-parameters=500,450,1000,350,1500,250,2000,100 autofitter:darkening-parameters=500,450,1000,350,1500,250,2000,100
