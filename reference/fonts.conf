<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  macOS theme for Omarchy — ~/.config/fontconfig/fonts.conf
  Replaces Omarchy's shipped fonts.conf. Verified against the patched
  SF font set with fc-match. See BUILD.md §7.
-->
<fontconfig>

  <!-- ============ generic families ============ -->
  <match target="pattern">
    <test name="family" qual="any"><string>sans-serif</string></test>
    <edit name="family" mode="assign" binding="strong">
      <string>SFProText Nerd Font Propo</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any"><string>monospace</string></test>
    <edit name="family" mode="assign" binding="strong">
      <string>SFMono Nerd Font Mono</string>
    </edit>
  </match>

  <!-- macOS has no system serif; keep Omarchy's -->
  <match target="pattern">
    <test name="family" qual="any"><string>serif</string></test>
    <edit name="family" mode="assign" binding="strong">
      <string>Liberation Serif</string>
    </edit>
  </match>

  <!-- ============ Apple system-font aliases ============ -->
  <!-- Every web page and Electron app that asks for the Apple system
       font now actually gets it. -->
  <alias>
    <family>system-ui</family>
    <prefer><family>SFProText Nerd Font Propo</family></prefer>
  </alias>
  <alias>
    <family>-apple-system</family>
    <prefer><family>SFProText Nerd Font Propo</family></prefer>
  </alias>
  <alias>
    <family>BlinkMacSystemFont</family>
    <prefer><family>SFProText Nerd Font Propo</family></prefer>
  </alias>
  <alias>
    <family>ui-monospace</family>
    <default><family>monospace</family></default>
  </alias>

  <!-- ============ macOS optical-size rule ============ -->
  <!-- SF Pro Text below 20pt, SF Pro Display at 20pt and above —
       the same crossover macOS itself uses. Must come AFTER the
       sans-serif assign above. -->
  <match target="pattern">
    <test name="family" qual="any"><string>SFProText Nerd Font Propo</string></test>
    <test name="size" compare="more_eq"><double>20</double></test>
    <edit name="family" mode="assign" binding="strong">
      <string>SFProDisplay Nerd Font Propo</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>SFProText Nerd Font Propo</string></test>
    <test name="pixelsize" compare="more_eq"><double>20</double></test>
    <edit name="family" mode="assign" binding="strong">
      <string>SFProDisplay Nerd Font Propo</string>
    </edit>
  </match>

  <!-- No synthetic oblique: SF Pro Text and Display ship real italics, and
       since 2026-10-24 so does this repo (overrides/fonts/build/). -->

  <!-- ============ emoji fallback ============ -->
  <alias><family>sans-serif</family><accept><family>Noto Color Emoji</family></accept></alias>
  <alias><family>serif</family><accept><family>Noto Color Emoji</family></accept></alias>
  <alias><family>monospace</family><accept><family>Noto Color Emoji</family></accept></alias>

</fontconfig>
