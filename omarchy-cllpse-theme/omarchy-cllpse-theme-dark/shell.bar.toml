[bar]
# omarchy-cllpse-theme — BUILD.md §6: opaque (1.0). The macOS menu bar is
# translucent over the wallpaper and this shipped at 0.72 for that reason; taken
# to full opacity on request, so the bar reads as a solid strip.
# omarchy-theme-set-templates splices this in by replacing the whole
# generated [bar] section, so every key it had is restated here. background/
# border/scrim-type keys are role-name tokens Color.qml resolves via
# composed()->flatColor(); text/active are read with a plain pick() that never
# unwraps role names, so those two must be literal hex or they render black.
# The omarchy-bar layer blur rule in overrides/hypr/looknfeel-decoration.lua is
# now inert for this surface: an opaque bar has nothing to blur through.
background        = "background"
background-alpha  = 1.0
text             = "#DDDDDD"   # foreground
active           = "#FF383C"   # urgent (Color.qml derives it from colors.toml `red`)
scale-with-font  = true
size-horizontal  = 26
size-vertical    = 28
